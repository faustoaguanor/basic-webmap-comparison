<!DOCTYPE html>
<html lang="es-EC" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mapa interactivo de Quito con OpenLayers, filtros, busqueda y herramientas GIS.">
<title>Quito GIS | OpenLayers</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.4.0/ol.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
--bg-1: #080c14;
--bg-2: #0a1628;
--panel: rgba(10, 16, 30, 0.78);
--panel-solid: #0e1525;
--panel-border: rgba(255, 255, 255, 0.06);
--panel-hover: rgba(255, 255, 255, 0.08);
--text-1: #f0f4f8;
--text-2: #8899aa;
--text-3: #556677;
--accent: #6c5ce7;
--accent-glow: rgba(108, 92, 231, 0.4);
--accent-2: #00cec9;
--accent-2-glow: rgba(0, 206, 201, 0.35);
--accent-3: #fd79a8;
--danger: #ff6b6b;
--warning: #feca57;
--success: #00b894;
--shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
--shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.3);
--radius: 20px;
--radius-sm: 12px;
--radius-xs: 8px;
--transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
--transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
--bg-1: #f0f3f8;
--bg-2: #dfe6f0;
--panel: rgba(255, 255, 255, 0.82);
--panel-solid: #ffffff;
--panel-border: rgba(0, 20, 60, 0.07);
--panel-hover: rgba(0, 20, 60, 0.05);
--text-1: #1a2035;
--text-2: #5a6a7a;
--text-3: #8a96a6;
--accent: #5a4cd1;
--accent-glow: rgba(90, 76, 209, 0.3);
--accent-2: #00a89d;
--accent-2-glow: rgba(0, 168, 157, 0.25);
--accent-3: #e84393;
--shadow: 0 24px 80px rgba(0, 20, 60, 0.12);
--shadow-sm: 0 4px 16px rgba(0, 20, 60, 0.08);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }

body {
font-family: "Inter", system-ui, -apple-system, sans-serif;
color: var(--text-1);
background: var(--bg-1);
overflow: hidden;
}

@keyframes gradientShift {
0%, 100% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
}

@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
0%, 100% { transform: scale(1); }
50% { transform: scale(1.05); }
}

.app {
position: relative;
width: 100vw; height: 100vh;
display: grid;
grid-template-columns: minmax(300px, 380px) 1fr;
gap: 0; overflow: hidden;
}

.app::before {
content: "";
position: fixed; top: -50%; left: -50%;
width: 200%; height: 200%;
background: radial-gradient(ellipse at 20% 20%, var(--accent-glow), transparent 40%),
radial-gradient(ellipse at 80% 80%, var(--accent-2-glow), transparent 40%);
animation: gradientShift 20s ease infinite;
background-size: 200% 200%;
pointer-events: none; z-index: 0;
}

#map { width: 100%; height: 100%; overflow: hidden; position: relative; z-index: 1; }

.panel {
background: var(--panel);
border-right: 1px solid var(--panel-border);
backdrop-filter: blur(24px) saturate(1.4);
-webkit-backdrop-filter: blur(24px) saturate(1.4);
display: flex; flex-direction: column; gap: 0;
overflow: hidden; z-index: 2; position: relative;
}

.panel-scroll {
overflow-y: auto; overflow-x: hidden; flex: 1;
padding: 24px 20px;
scrollbar-width: thin; scrollbar-color: var(--panel-border) transparent;
}

.panel-scroll::-webkit-scrollbar { width: 4px; }
.panel-scroll::-webkit-scrollbar-track { background: transparent; }
.panel-scroll::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }

.panel-header { padding: 24px 20px 0; }

.brand {
display: flex; align-items: center; gap: 12px;
margin-bottom: 6px; animation: fadeIn 0.6s ease;
}

.brand-icon {
width: 42px; height: 42px;
border-radius: var(--radius-sm);
background: linear-gradient(135deg, var(--accent), var(--accent-2));
display: flex; align-items: center; justify-content: center;
font-size: 20px; color: #fff; flex-shrink: 0;
box-shadow: 0 4px 16px var(--accent-glow);
}

.brand-text h1 {
font-family: "Playfair Display", serif;
font-size: 24px; letter-spacing: -0.5px; line-height: 1.1;
}

.brand-text span {
font-size: 11px; color: var(--text-3);
text-transform: uppercase; letter-spacing: 2px; font-weight: 600;
}

.topbar {
display: flex; align-items: center; justify-content: space-between;
padding: 16px 20px;
border-bottom: 1px solid var(--panel-border); gap: 8px;
}

.topbar-actions { display: flex; gap: 6px; align-items: center; }

.icon-btn {
width: 36px; height: 36px;
border: 1px solid var(--panel-border);
background: var(--panel-hover);
color: var(--text-2);
border-radius: var(--radius-xs);
cursor: pointer;
display: flex; align-items: center; justify-content: center;
font-size: 14px;
transition: all var(--transition-fast);
}

.icon-btn:hover {
background: var(--accent); color: #fff; border-color: var(--accent);
transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow);
}

.icon-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.section { margin-bottom: 20px; animation: fadeIn 0.5s ease both; }
.section:nth-child(2) { animation-delay: 0.1s; }
.section:nth-child(3) { animation-delay: 0.15s; }
.section:nth-child(4) { animation-delay: 0.2s; }
.section:nth-child(5) { animation-delay: 0.25s; }

.section-header {
display: flex; align-items: center; justify-content: space-between;
cursor: pointer; user-select: none;
padding: 8px 0; margin-bottom: 10px;
}

.section-header h2 {
font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
color: var(--text-3); font-weight: 700;
display: flex; align-items: center; gap: 8px;
}

.section-header h2 i { font-size: 12px; color: var(--accent); }

.section-chevron {
font-size: 10px; color: var(--text-3);
transition: transform var(--transition);
}

.section.collapsed .section-chevron { transform: rotate(-90deg); }
.section.collapsed .section-body { display: none; }

.search-wrapper { position: relative; margin-bottom: 16px; }

.search-wrapper i.search-icon {
position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
color: var(--text-3); font-size: 14px; pointer-events: none;
transition: color var(--transition-fast);
}

.search-input {
width: 100%; padding: 12px 14px 12px 40px;
border-radius: var(--radius-sm);
background: var(--panel-hover);
border: 1px solid var(--panel-border);
color: var(--text-1); font-size: 14px; font-family: inherit; outline: none;
transition: all var(--transition);
}

.search-input::placeholder { color: var(--text-3); }

.search-input:focus {
border-color: var(--accent);
box-shadow: 0 0 0 3px var(--accent-glow);
background: rgba(108, 92, 231, 0.06);
}

.search-input:focus + i.search-icon,
.search-wrapper:focus-within i.search-icon { color: var(--accent); }

.search-clear {
position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
background: none; border: none; color: var(--text-3);
cursor: pointer; font-size: 12px; padding: 4px; display: none;
transition: color var(--transition-fast);
}

.search-clear:hover { color: var(--danger); }

.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }

.chip {
border: 1px solid var(--panel-border);
background: var(--panel-hover);
color: var(--text-2);
border-radius: 999px; padding: 7px 14px;
font-size: 12px; font-weight: 600; cursor: pointer;
transition: all var(--transition);
display: flex; align-items: center; gap: 6px; font-family: inherit;
}

.chip i { font-size: 11px; }

.chip:hover {
border-color: var(--accent); color: var(--accent);
background: rgba(108, 92, 231, 0.08);
}

.chip.active {
background: linear-gradient(135deg, var(--accent), var(--accent-2));
color: #fff; border-color: transparent;
box-shadow: 0 4px 14px var(--accent-glow);
}

.chip .count {
background: rgba(255, 255, 255, 0.2);
padding: 1px 6px; border-radius: 999px; font-size: 10px;
}

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }

.stat-card {
background: var(--panel-hover);
border: 1px solid var(--panel-border);
border-radius: var(--radius-sm);
padding: 12px; text-align: center;
transition: all var(--transition);
}

.stat-card:hover {
border-color: var(--accent);
transform: translateY(-2px); box-shadow: var(--shadow-sm);
}

.stat-card .stat-value {
font-size: 22px; font-weight: 800;
background: linear-gradient(135deg, var(--accent), var(--accent-2));
-webkit-background-clip: text; -webkit-text-fill-color: transparent;
background-clip: text; line-height: 1;
}

.stat-card .stat-label {
font-size: 10px; color: var(--text-3);
text-transform: uppercase; letter-spacing: 1.5px;
margin-top: 4px; font-weight: 600;
}

.poi-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

.poi-item {
border-radius: var(--radius-sm);
border: 1px solid var(--panel-border);
padding: 14px;
display: flex; gap: 12px;
background: var(--panel-hover);
cursor: pointer;
transition: all var(--transition);
position: relative; overflow: hidden;
}

.poi-item::before {
content: "";
position: absolute; top: 0; left: 0;
width: 3px; height: 100%;
background: linear-gradient(180deg, var(--accent), var(--accent-2));
opacity: 0; transition: opacity var(--transition);
}

.poi-item:hover {
transform: translateX(4px);
border-color: var(--accent);
background: rgba(108, 92, 231, 0.06);
}

.poi-item:hover::before { opacity: 1; }

.poi-icon {
width: 40px; height: 40px;
border-radius: var(--radius-xs);
display: flex; align-items: center; justify-content: center;
font-size: 16px; flex-shrink: 0;
}

.poi-icon.mirador { background: rgba(0, 206, 201, 0.15); color: var(--accent-2); }
.poi-icon.cultura { background: rgba(108, 92, 231, 0.15); color: var(--accent); }
.poi-icon.barrio { background: rgba(253, 121, 168, 0.15); color: var(--accent-3); }
.poi-icon.naturaleza { background: rgba(0, 184, 148, 0.15); color: var(--success); }
.poi-icon.gastronomia { background: rgba(254, 202, 87, 0.15); color: var(--warning); }

.poi-content { flex: 1; min-width: 0; }

.poi-title {
font-size: 14px; font-weight: 600; margin-bottom: 3px;
display: flex; align-items: center; gap: 6px;
}

.poi-type-badge {
font-size: 9px; padding: 2px 6px; border-radius: 999px;
text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;
}

.poi-type-badge.mirador { background: rgba(0, 206, 201, 0.15); color: var(--accent-2); }
.poi-type-badge.cultura { background: rgba(108, 92, 231, 0.15); color: var(--accent); }
.poi-type-badge.barrio { background: rgba(253, 121, 168, 0.15); color: var(--accent-3); }
.poi-type-badge.naturaleza { background: rgba(0, 184, 148, 0.15); color: var(--success); }
.poi-type-badge.gastronomia { background: rgba(254, 202, 87, 0.15); color: var(--warning); }

.poi-desc {
font-size: 12px; color: var(--text-2); line-height: 1.4;
display: -webkit-box; -webkit-line-clamp: 2;
-webkit-box-orient: vertical; overflow: hidden;
}

.poi-coords {
font-size: 10px; color: var(--text-3); margin-top: 4px;
font-family: "SF Mono", "Fira Code", monospace;
}

.tools-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

.tool-card {
background: var(--panel-hover);
border: 1px solid var(--panel-border);
border-radius: var(--radius-sm);
padding: 14px; cursor: pointer;
transition: all var(--transition);
display: flex; flex-direction: column;
align-items: center; gap: 8px;
text-align: center; font-family: inherit; color: var(--text-1);
}

.tool-card:hover {
border-color: var(--accent);
transform: translateY(-2px); box-shadow: var(--shadow-sm);
}

.tool-card.active {
background: rgba(108, 92, 231, 0.1);
border-color: var(--accent);
}

.tool-card i { font-size: 18px; color: var(--accent); transition: transform var(--transition); }
.tool-card:hover i { transform: scale(1.15); }
.tool-card span { font-size: 11px; font-weight: 600; color: var(--text-2); }

.coord-display {
background: var(--panel-hover);
border: 1px solid var(--panel-border);
border-radius: var(--radius-sm);
padding: 12px 14px;
display: flex; align-items: center; gap: 10px;
font-family: "SF Mono", "Fira Code", monospace;
font-size: 12px; color: var(--text-2);
}

.coord-display i { color: var(--accent-2); font-size: 14px; }
.coord-display .coord-value { color: var(--text-1); font-weight: 600; }

.coords-bar {
position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
z-index: 10;
background: var(--panel); backdrop-filter: blur(16px);
border: 1px solid var(--panel-border);
border-radius: 999px; padding: 6px 18px;
font-family: "SF Mono", "Fira Code", monospace;
font-size: 11px; color: var(--text-2);
display: flex; align-items: center; gap: 12px;
box-shadow: var(--shadow-sm); white-space: nowrap;
}

.coords-bar .coord-val { color: var(--accent-2); font-weight: 600; }
.coords-bar .zoom-val { color: var(--accent); font-weight: 600; }

.toast-container {
position: fixed; top: 20px; right: 20px; z-index: 10000;
display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}

.toast {
background: var(--panel-solid);
border: 1px solid var(--panel-border);
border-radius: var(--radius-sm);
padding: 12px 18px; font-size: 13px; color: var(--text-1);
box-shadow: var(--shadow);
display: flex; align-items: center; gap: 10px;
animation: fadeIn 0.3s ease;
backdrop-filter: blur(16px); pointer-events: auto;
min-width: 240px;
}

.toast i { font-size: 16px; }
.toast.success i { color: var(--success); }
.toast.info i { color: var(--accent); }
.toast.warning i { color: var(--warning); }

.popup-overlay {
position: absolute; bottom: 48px; left: -120px;
min-width: 240px;
background: var(--panel-solid) !important;
border-radius: var(--radius-sm) !important;
padding: 14px 18px !important;
box-shadow: var(--shadow) !important;
border: 1px solid var(--panel-border) !important;
color: var(--text-1);
pointer-events: none; opacity: 0;
transform: translateY(6px);
transition: opacity 0.25s ease, transform 0.25s ease;
font-family: "Inter", system-ui, sans-serif;
}

.popup-overlay.is-visible {
opacity: 1; transform: translateY(0); pointer-events: auto;
}

.popup-overlay h3 {
font-size: 16px; font-weight: 700;
color: var(--text-1); margin-bottom: 4px;
}

.popup-overlay p {
font-size: 13px; color: var(--text-2);
margin: 0; line-height: 1.5;
}

.popup-overlay .popup-type {
display: inline-block;
font-size: 10px; padding: 2px 8px; border-radius: 999px;
text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
margin-bottom: 6px;
}

.popup-overlay .popup-coords {
font-size: 10px; color: var(--text-3);
font-family: monospace; margin-top: 8px;
}

.popup-overlay::after {
content: "";
position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
width: 0; height: 0;
border-left: 8px solid transparent;
border-right: 8px solid transparent;
border-top: 8px solid var(--panel-solid);
}

.popup-closer {
position: absolute; top: 6px; right: 10px;
background: none; border: none;
font-size: 18px; line-height: 1;
cursor: pointer; color: var(--text-3); pointer-events: auto;
transition: color 0.15s;
}

.popup-closer:hover { color: var(--text-1); }

.ol-control {
background: var(--panel) !important;
backdrop-filter: blur(16px) !important;
border-radius: var(--radius-xs) !important;
border: 1px solid var(--panel-border) !important;
box-shadow: var(--shadow-sm) !important;
}

.ol-control button {
border-radius: var(--radius-xs) !important;
color: var(--text-1) !important;
font-size: 18px !important; font-weight: 600 !important;
background: transparent !important;
transition: background 0.15s;
}

.ol-control button:hover { background: var(--panel-hover) !important; }

.ol-scale-line {
background: var(--panel) !important;
backdrop-filter: blur(8px) !important;
border-radius: 6px !important;
border: 1px solid var(--panel-border) !important;
box-shadow: var(--shadow-sm) !important;
}

.ol-scale-line-inner {
color: var(--text-2) !important;
border-color: var(--accent-2) !important;
font-size: 11px !important;
}

.ol-attribution {
background: var(--panel) !important;
color: var(--text-3) !important;
font-size: 10px !important;
border-radius: 8px 0 0 0 !important;
backdrop-filter: blur(8px) !important;
border: 1px solid var(--panel-border) !important;
}

.ol-attribution a { color: var(--accent) !important; }

.ol-zoom { top: auto !important; bottom: 80px !important; right: 10px !important; left: auto !important; }

.base-layers {
display: flex; gap: 8px; overflow-x: auto;
padding-bottom: 4px; scrollbar-width: none;
}

.base-layers::-webkit-scrollbar { display: none; }

.base-card {
min-width: 80px; height: 60px;
border-radius: var(--radius-xs);
border: 2px solid var(--panel-border);
cursor: pointer; transition: all var(--transition);
display: flex; align-items: flex-end; justify-content: center;
padding-bottom: 6px; font-size: 9px; font-weight: 700;
text-transform: uppercase; letter-spacing: 1px;
color: var(--text-2); position: relative; overflow: hidden;
font-family: inherit; background: var(--panel-hover);
}

.base-card:hover { border-color: var(--accent); }

.base-card.active {
border-color: var(--accent);
box-shadow: 0 0 0 2px var(--accent-glow);
color: var(--accent);
}

.base-card.active::after {
content: ""; position: absolute; top: 4px; right: 4px;
width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
}

.measure-panel {
position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
z-index: 10;
background: var(--panel); backdrop-filter: blur(16px);
border: 1px solid var(--panel-border);
border-radius: var(--radius-sm);
padding: 14px 20px;
box-shadow: var(--shadow); display: none; text-align: center;
}

.measure-panel.active { display: block; animation: fadeIn 0.3s ease; }

.measure-panel .measure-value {
font-size: 24px; font-weight: 800;
background: linear-gradient(135deg, var(--accent), var(--accent-2));
-webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.measure-panel .measure-label {
font-size: 10px; color: var(--text-3);
text-transform: uppercase; letter-spacing: 2px; margin-top: 4px;
}

.measure-panel .measure-hint {
font-size: 11px; color: var(--text-2); margin-top: 8px;
}

.mobile-toggle {
display: none;
position: absolute; top: 16px; left: 16px; z-index: 1001;
}

.close-mobile { display: none; }

@media (max-width: 900px) {
.app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.panel {
position: absolute; top: 0; left: 0;
width: 100%; height: 100%; z-index: 100;
transform: translateX(-100%);
transition: transform var(--transition);
}
.panel.open { transform: translateX(0); }
.mobile-toggle { display: flex; }
.panel .close-mobile { display: flex; position: absolute; top: 16px; right: 16px; }
}
</style>
</head>
<body>
<div class="app">
<button class="icon-btn mobile-toggle" id="mobile-toggle" aria-label="Abrir panel">
<i class="fas fa-bars"></i>
</button>

<aside class="panel" id="panel">
<button class="icon-btn close-mobile" id="close-panel" aria-label="Cerrar panel">
<i class="fas fa-times"></i>
</button>

<div class="panel-header">
<div class="brand">
<div class="brand-icon"><i class="fas fa-map-location-dot"></i></div>
<div class="brand-text">
<h1>Quito GIS</h1>
<span>OpenLayers</span>
</div>
</div>
</div>

<div class="topbar">
<div class="topbar-actions">
<button class="icon-btn active" id="btn-dark" data-theme-option="dark" title="Tema oscuro"><i class="fas fa-moon"></i></button>
<button class="icon-btn" id="btn-light" data-theme-option="light" title="Tema claro"><i class="fas fa-sun"></i></button>
<button class="icon-btn" id="btn-fullscreen" title="Pantalla completa"><i class="fas fa-expand"></i></button>
</div>
</div>

<div class="panel-scroll">
<div class="section" id="sec-search">
<div class="section-header" data-section="sec-search">
<h2><i class="fas fa-magnifying-glass"></i> Busqueda</h2>
<i class="fas fa-chevron-down section-chevron"></i>
</div>
<div class="section-body">
<div class="search-wrapper">
<i class="fas fa-magnifying-glass search-icon"></i>
<input class="search-input" id="search-input" type="text" placeholder="Buscar puntos de interes..." autocomplete="off">
<button class="search-clear" id="search-clear" type="button"><i class="fas fa-xmark"></i></button>
</div>
</div>
</div>

<div class="section" id="sec-filters">
<div class="section-header" data-section="sec-filters">
<h2><i class="fas fa-filter"></i> Categorias</h2>
<i class="fas fa-chevron-down section-chevron"></i>
</div>
<div class="section-body">
<div class="filters" id="filters-container">
<button class="chip active" data-filter="all"><i class="fas fa-globe"></i> Todos <span class="count" id="count-all">0</span></button>
<button class="chip" data-filter="mirador"><i class="fas fa-mountain-sun"></i> Miradores <span class="count" id="count-mirador">0</span></button>
<button class="chip" data-filter="cultura"><i class="fas fa-landmark"></i> Cultura <span class="count" id="count-cultura">0</span></button>
<button class="chip" data-filter="barrio"><i class="fas fa-city"></i> Barrios <span class="count" id="count-barrio">0</span></button>
<button class="chip" data-filter="naturaleza"><i class="fas fa-leaf"></i> Naturaleza <span class="count" id="count-naturaleza">0</span></button>
<button class="chip" data-filter="gastronomia"><i class="fas fa-utensils"></i> Gastronomia <span class="count" id="count-gastronomia">0</span></button>
</div>
</div>
</div>

<div class="section" id="sec-stats">
<div class="section-header" data-section="sec-stats">
<h2><i class="fas fa-chart-simple"></i> Estadisticas</h2>
<i class="fas fa-chevron-down section-chevron"></i>
</div>
<div class="section-body">
<div class="stats-row">
<div class="stat-card"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Puntos</div></div>
<div class="stat-card"><div class="stat-value" id="stat-visible">0</div><div class="stat-label">Visibles</div></div>
<div class="stat-card"><div class="stat-value" id="stat-zoom">13</div><div class="stat-label">Zoom</div></div>
</div>
</div>
</div>

<div class="section" id="sec-tools">
<div class="section-header" data-section="sec-tools">
<h2><i class="fas fa-wrench"></i> Herramientas</h2>
<i class="fas fa-chevron-down section-chevron"></i>
</div>
<div class="section-body">
<div class="tools-grid">
<button class="tool-card" id="tool-measure"><i class="fas fa-ruler"></i><span>Medir</span></button>
<button class="tool-card" id="tool-locate"><i class="fas fa-location-crosshairs"></i><span>Ubicacion</span></button>
<button class="tool-card" id="tool-center"><i class="fas fa-crosshairs"></i><span>Centrar</span></button>
<button class="tool-card" id="tool-layers"><i class="fas fa-layer-group"></i><span>Capas</span></button>
</div>
<div class="base-layers" id="base-layers" style="margin-top:12px;display:none;">
<button class="base-card active" data-base="dark" style="background:linear-gradient(135deg,#0a1628,#1a1a2e);">Dark</button>
<button class="base-card" data-base="light" style="background:linear-gradient(135deg,#dfe6f0,#f0f3f8);">Light</button>
<button class="base-card" data-base="osm" style="background:linear-gradient(135deg,#52b788,#95d5b2);">OSM</button>
</div>
</div>
</div>

<div class="section" id="sec-coords">
<div class="section-header" data-section="sec-coords">
<h2><i class="fas fa-location-dot"></i> Coordenadas</h2>
<i class="fas fa-chevron-down section-chevron"></i>
</div>
<div class="section-body">
<div class="coord-display">
<i class="fas fa-location-dot"></i>
<div>
<div>Lat: <span class="coord-value" id="coord-lat">-0.22985</span></div>
<div>Lng: <span class="coord-value" id="coord-lng">-78.52495</span></div>
</div>
</div>
</div>
</div>

<div class="section" id="sec-pois">
<div class="section-header" data-section="sec-pois">
<h2><i class="fas fa-map-pin"></i> Puntos de interes</h2>
<i class="fas fa-chevron-down section-chevron"></i>
</div>
<div class="section-body">
<ul class="poi-list" id="poi-list" aria-live="polite"></ul>
</div>
</div>
</div>
</aside>

<main id="map"></main>

<div id="popup" class="popup-overlay">
<button id="popup-closer" class="popup-closer" aria-label="Cerrar">&times;</button>
<div id="popup-content"></div>
</div>

<div class="coords-bar" id="coords-bar">
<span><i class="fas fa-location-dot" style="color:var(--accent-2)"></i> <span class="coord-val" id="bar-lat">-0.2299</span>, <span class="coord-val" id="bar-lng">-78.5250</span></span>
<span>|</span>
<span><i class="fas fa-search-plus" style="color:var(--accent)"></i> Zoom <span class="zoom-val" id="bar-zoom">13</span></span>
</div>

<div class="measure-panel" id="measure-panel">
<div class="measure-value" id="measure-value">0.00 km</div>
<div class="measure-label">Distancia total</div>
<div class="measure-hint" id="measure-hint">Haz clic en el mapa para iniciar la medicion</div>
</div>

<div class="toast-container" id="toast-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ol@v10.4.0/dist/ol.min.js"></script>
<script>
(function() {
"use strict";

var QUITO = [-78.52495, -0.22985];
var ZOOM_INICIAL = 13;

var typeColors = { mirador: "#00cec9", cultura: "#6c5ce7", barrio: "#fd79a8", naturaleza: "#00b894", gastronomia: "#feca57" };

var puntosTuristicos = [
{ lonlat: [-78.45556, -0.00222], nombre: "Mitad del Mundo", descripcion: "Monumento que marca la linea ecuatorial. Uno de los sitios mas visitados del pais.", tipo: "cultura", icon: "fa-landmark" },
{ lonlat: [-78.50833, -0.21861], nombre: "Centro Historico", descripcion: "Corazon colonial de Quito con iglesias, plazas y museos declarados Patrimonio de la Humanidad.", tipo: "cultura", icon: "fa-landmark" },
{ lonlat: [-78.54056, -0.20194], nombre: "Teleferico de Quito", descripcion: "Teleferico que asciende al volcan Pichincha a mas de 4000 msnm con vistas panoramicas.", tipo: "mirador", icon: "fa-mountain-sun" },
{ lonlat: [-78.51861, -0.22861], nombre: "El Panecillo", descripcion: "Colina con la iconica estatua de la Virgen de Quito y una vista de 360 grados de la capital.", tipo: "mirador", icon: "fa-mountain-sun" },
{ lonlat: [-78.49417, -0.21306], nombre: "La Mariscal", descripcion: "Barrio bohemio y cultural, famoso por su vida nocturna, galerias de arte y restaurantes.", tipo: "barrio", icon: "fa-city" },
{ lonlat: [-78.5167, -0.25], nombre: "Parque Metropolitano Guangüiltagua", descripcion: "El bosque protector mas grande de Quito con 557 hectareas de flora nativa y senderos.", tipo: "naturaleza", icon: "fa-leaf" },
{ lonlat: [-78.4708, -0.1807], nombre: "Parque La Carolina", descripcion: "Pulmon verde del norte de Quito con jardines, lagos, ciclovias y el Jardin Botanico.", tipo: "naturaleza", icon: "fa-leaf" },
{ lonlat: [-78.505, -0.22], nombre: "La Ronda", descripcion: "Callejon colonial restaurado con artesanos, gastronomia tradicional y vida nocturna cultural.", tipo: "gastronomia", icon: "fa-utensils" },
{ lonlat: [-78.51, -0.215], nombre: "Plaza Foch", descripcion: "Centro gastronomico y de entretenimiento con restaurantes internacionales y cocina fusion.", tipo: "gastronomia", icon: "fa-utensils" },
{ lonlat: [-78.5113, -0.1923], nombre: "Parque Itchimbia", descripcion: "Mirador natural con vista panoramica del Centro Historico y el cerro del Panecillo.", tipo: "mirador", icon: "fa-mountain-sun" },
{ lonlat: [-78.5076, -0.2198], nombre: "Iglesia de la Compania", descripcion: "Joyita barroca con interior recubierto de oro, considerada la mas bella de Latinoamerica.", tipo: "cultura", icon: "fa-landmark" },
{ lonlat: [-78.5097, -0.2214], nombre: "Barrio San Marcos", descripcion: "Barrio patrimonial emergente con galerias de arte contemporaneo y cafeterias especializadas.", tipo: "barrio", icon: "fa-city" },
];

var view = new ol.View({
center: ol.proj.fromLonLat(QUITO),
zoom: ZOOM_INICIAL,
minZoom: 10,
maxZoom: 19
});

var osmLayer = new ol.layer.Tile({
source: new ol.source.OSM(),
visible: false,
className: "osm-layer"
});

var cartoDarkLayer = new ol.layer.Tile({
source: new ol.source.XYZ({
url: "https://{a-d}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png",
attributions: "&copy; OSM &copy; CARTO"
}),
visible: true,
className: "dark-layer"
});

var cartoLightLayer = new ol.layer.Tile({
source: new ol.source.XYZ({
url: "https://{a-d}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
attributions: "&copy; OSM &copy; CARTO"
}),
visible: false,
className: "light-layer"
});

var baseLayers = { dark: cartoDarkLayer, light: cartoLightLayer, osm: osmLayer };
var currentBaseKey = "dark";

var map = new ol.Map({
target: "map",
view: view,
layers: [cartoDarkLayer, cartoLightLayer, osmLayer],
controls: ol.control.defaults.defaults({ zoom: false, attribution: true, rotate: false }).extend([
new ol.control.ScaleLine({ units: "metric" })
])
});

var zoomControl = new ol.control.Zoom();
zoomControl.setTarget(document.createElement("div"));
map.addControl(zoomControl);

function createMarkerStyle(type) {
var color = typeColors[type] || "#6c5ce7";
var svg = '<svg width="30" height="40" viewBox="0 0 30 40" xmlns="http://www.w3.org/2000/svg">' +
'<path d="M15 0C6.72 0 0 6.72 0 15c0 11.25 15 25 15 25s15-13.75 15-25C30 6.72 23.28 0 15 0z" fill="' + color + '"/>' +
'<circle cx="15" cy="14" r="6" fill="white"/>' +
"</svg>";
return new ol.style.Style({
image: new ol.style.Icon({
src: "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg),
anchor: [0.5, 1],
scale: 1
})
});
}

var vectorSource = new ol.source.Vector({ features: [] });
var vectorLayer = new ol.layer.Vector({ source: vectorSource });
map.addLayer(vectorLayer);

var allFeatures = [];

function buildFeatures() {
vectorSource.clear();
allFeatures = [];
puntosTuristicos.forEach(function(p) {
var feature = new ol.Feature({
geometry: new ol.geom.Point(ol.proj.fromLonLat(p.lonlat)),
nombre: p.nombre,
descripcion: p.descripcion,
tipo: p.tipo,
icon: p.icon,
lonlat: p.lonlat
});
feature.setStyle(createMarkerStyle(p.tipo));
allFeatures.push(feature);
vectorSource.addFeature(feature);
});
}

buildFeatures();

var poiList = document.getElementById("poi-list");
var searchInput = document.getElementById("search-input");
var searchClear = document.getElementById("search-clear");
var filterButtons = Array.from(document.querySelectorAll(".chip[data-filter]"));

function applyFilters() {
var query = searchInput.value.trim().toLowerCase();
var activeFilter = document.querySelector(".chip.active[data-filter]").dataset.filter;

vectorSource.clear();
var filtered = allFeatures.filter(function(f) {
var nombre = f.get("nombre").toLowerCase();
var desc = f.get("descripcion").toLowerCase();
var tipo = f.get("tipo");
var matchesText = nombre.includes(query) || desc.includes(query);
var matchesFilter = activeFilter === "all" || tipo === activeFilter;
return matchesText && matchesFilter;
});

filtered.forEach(function(f) { vectorSource.addFeature(f); });

renderList(filtered);
document.getElementById("stat-visible").textContent = filtered.length;
}

function renderList(items) {
poiList.innerHTML = "";
items.forEach(function(f) {
var nombre = f.get("nombre");
var descripcion = f.get("descripcion");
var tipo = f.get("tipo");
var icon = f.get("icon") || "fa-map-pin";
var lonlat = f.get("lonlat");

var li = document.createElement("li");
li.className = "poi-item";
li.setAttribute("tabindex", "0");
li.innerHTML =
'<div class="poi-icon ' + tipo + '"><i class="fas ' + icon + '"></i></div>' +
'<div class="poi-content">' +
'<span class="poi-title">' + nombre + ' <span class="poi-type-badge ' + tipo + '">' + tipo + '</span></span>' +
'<span class="poi-desc">' + descripcion + '</span>' +
'<span class="poi-coords">' + lonlat[1].toFixed(4) + ', ' + lonlat[0].toFixed(4) + '</span>' +
"</div>";
var openItem = function() {
view.animate({
center: ol.proj.fromLonLat(lonlat),
zoom: 15,
duration: 500
});
var popupEl = document.getElementById("popup");
var popupContent = document.getElementById("popup-content");
var color = typeColors[tipo] || "#6c5ce7";
popupContent.innerHTML =
'<span class="popup-type" style="background:' + color + '22;color:' + color + ';">' + tipo + "</span>" +
"<h3>" + nombre + "</h3>" +
"<p>" + descripcion + "</p>" +
'<div class="popup-coords">Lat: ' + lonlat[1].toFixed(5) + " | Lng: " + lonlat[0].toFixed(5) + "</div>";
popupOverlay.setPosition(ol.proj.fromLonLat(lonlat));
popupEl.classList.add("is-visible");
};
li.addEventListener("click", openItem);
li.addEventListener("keydown", function(e) {
if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openItem(); }
});
poiList.appendChild(li);
});
}

filterButtons.forEach(function(button) {
button.addEventListener("click", function() {
filterButtons.forEach(function(btn) { btn.classList.remove("active"); });
button.classList.add("active");
applyFilters();
});
});

searchInput.addEventListener("input", function() {
searchClear.style.display = searchInput.value ? "block" : "none";
applyFilters();
});

searchClear.addEventListener("click", function() {
searchInput.value = "";
searchClear.style.display = "none";
applyFilters();
searchInput.focus();
});

document.querySelectorAll(".section-header").forEach(function(header) {
header.addEventListener("click", function() {
header.parentElement.classList.toggle("collapsed");
});
});

function updateCounts() {
var counts = { all: puntosTuristicos.length, mirador: 0, cultura: 0, barrio: 0, naturaleza: 0, gastronomia: 0 };
puntosTuristicos.forEach(function(p) { counts[p.tipo] = (counts[p.tipo] || 0) + 1; });
Object.keys(counts).forEach(function(key) {
var el = document.getElementById("count-" + key);
if (el) el.textContent = counts[key];
});
document.getElementById("stat-total").textContent = puntosTuristicos.length;
}

var popupEl = document.getElementById("popup");
var popupContent = document.getElementById("popup-content");
var popupCloser = document.getElementById("popup-closer");

var popupOverlay = new ol.Overlay({
element: popupEl,
positioning: "bottom-center",
offset: [0, -12],
autoPan: true,
autoPanAnimation: { duration: 250 }
});

map.addOverlay(popupOverlay);

popupCloser.addEventListener("click", function() {
popupOverlay.setPosition(undefined);
popupEl.classList.remove("is-visible");
});

document.addEventListener("keydown", function(e) {
if (e.key === "Escape") {
popupOverlay.setPosition(undefined);
popupEl.classList.remove("is-visible");
}
});

map.on("click", function(evt) {
var feature = map.forEachFeatureAtPixel(evt.pixel, function(f) { return f; });
if (feature) {
var nombre = feature.get("nombre");
var descripcion = feature.get("descripcion");
var tipo = feature.get("tipo");
var lonlat = feature.get("lonlat");
var color = typeColors[tipo] || "#6c5ce7";
popupContent.innerHTML =
'<span class="popup-type" style="background:' + color + '22;color:' + color + ';">' + tipo + "</span>" +
"<h3>" + nombre + "</h3>" +
"<p>" + descripcion + "</p>" +
'<div class="popup-coords">Lat: ' + lonlat[1].toFixed(5) + " | Lng: " + lonlat[0].toFixed(5) + "</div>";
popupOverlay.setPosition(evt.coordinate);
popupEl.classList.add("is-visible");
} else {
popupOverlay.setPosition(undefined);
popupEl.classList.remove("is-visible");
}
});

map.on("pointermove", function(evt) {
var hit = map.hasFeatureAtPixel(evt.pixel);
map.getTargetElement().style.cursor = hit ? "pointer" : "";
});

map.on("moveend", function() {
var z = view.getZoom();
document.getElementById("stat-zoom").textContent = z;
document.getElementById("bar-zoom").textContent = z;
});

map.on("pointermove", function(evt) {
if (evt.dragging) return;
var coords = ol.proj.toLonLat(evt.coordinate);
document.getElementById("coord-lat").textContent = coords[1].toFixed(5);
document.getElementById("coord-lng").textContent = coords[0].toFixed(5);
document.getElementById("bar-lat").textContent = coords[1].toFixed(4);
document.getElementById("bar-lng").textContent = coords[0].toFixed(4);
});

document.getElementById("tool-center").addEventListener("click", function() {
view.animate({ center: ol.proj.fromLonLat(QUITO), zoom: ZOOM_INICIAL, duration: 500 });
showToast("Mapa centrado en Quito", "success");
});

document.getElementById("tool-layers").addEventListener("click", function() {
var layersDiv = document.getElementById("base-layers");
layersDiv.style.display = layersDiv.style.display === "none" ? "flex" : "none";
});

document.querySelectorAll(".base-card").forEach(function(card) {
card.addEventListener("click", function() {
var key = card.dataset.base;
document.querySelectorAll(".base-card").forEach(function(c) { c.classList.remove("active"); });
card.classList.add("active");
Object.keys(baseLayers).forEach(function(k) {
baseLayers[k].setVisible(k === key);
});
currentBaseKey = key;
});
});

function setTheme(theme) {
document.documentElement.setAttribute("data-theme", theme);
document.querySelectorAll("[data-theme-option]").forEach(function(btn) {
btn.classList.toggle("active", btn.dataset.themeOption === theme);
});
var newBase = theme === "light" ? "light" : "dark";
Object.keys(baseLayers).forEach(function(k) {
baseLayers[k].setVisible(k === newBase);
});
currentBaseKey = newBase;
document.querySelectorAll(".base-card").forEach(function(c) { c.classList.remove("active"); });
document.querySelector('.base-card[data-base="' + newBase + '"]').classList.add("active");
showToast("Tema " + (theme === "light" ? "claro" : "oscuro") + " activado", "info");
}

document.querySelectorAll("[data-theme-option]").forEach(function(btn) {
btn.addEventListener("click", function() { setTheme(btn.dataset.themeOption); });
});

document.getElementById("btn-fullscreen").addEventListener("click", function() {
if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); }
else { document.exitFullscreen(); }
});

var measureMode = false;
var measureSource = new ol.source.Vector({ features: [] });
var measureLayer = new ol.layer.Vector({
source: measureSource,
style: new ol.style.Style({
stroke: new ol.style.Stroke({ color: "#6c5ce7", width: 3, lineDash: [8, 8] }),
image: new ol.style.Circle({ radius: 5, fill: new ol.style.Fill({ color: "#6c5ce7" }) })
})
});
measureLayer.setVisible(false);
map.addLayer(measureLayer);

document.getElementById("tool-measure").addEventListener("click", function() {
measureMode = !measureMode;
document.getElementById("tool-measure").classList.toggle("active", measureMode);
document.getElementById("measure-panel").classList.toggle("active", measureMode);
measureLayer.setVisible(measureMode);
if (measureMode) {
showToast("Modo medicion activado. Haz clic en el mapa.", "info");
document.getElementById("measure-hint").textContent = "Haz clic en el mapa para agregar puntos";
map.getTargetElement().style.cursor = "crosshair";
} else {
clearMeasure();
map.getTargetElement().style.cursor = "";
showToast("Medicion desactivada", "info");
}
});

function clearMeasure() {
measureSource.clear();
document.getElementById("measure-value").textContent = "0.00 km";
document.getElementById("measure-hint").textContent = "Haz clic en el mapa para iniciar la medicion";
}

function formatDistance(meters) {
if (meters >= 1000) return (meters / 1000).toFixed(2) + " km";
return meters.toFixed(0) + " m";
}

var measurePoints = [];

map.on("click", function(evt) {
if (!measureMode) return;
measurePoints.push(evt.coordinate);
var point = new ol.Feature({ geometry: new ol.geom.Point(evt.coordinate) });
measureSource.addFeature(point);

if (measurePoints.length > 1) {
var line = new ol.Feature({ geometry: new ol.geom.LineString(measurePoints) });
measureSource.addFeature(line);
var totalDist = 0;
for (var i = 1; i < measurePoints.length; i++) {
var c1 = ol.proj.toLonLat(measurePoints[i - 1]);
var c2 = ol.proj.toLonLat(measurePoints[i]);
var lat1 = c1[1] * Math.PI / 180, lat2 = c2[1] * Math.PI / 180;
var dLat = lat2 - lat1;
var dLon = (c2[0] - c1[0]) * Math.PI / 180;
var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
totalDist += 6371000 * c;
}
document.getElementById("measure-value").textContent = formatDistance(totalDist);
document.getElementById("measure-hint").textContent = "Haz doble clic para terminar";
}
});

map.on("dblclick", function(evt) {
if (measureMode) {
evt.stopPropagation();
measureMode = false;
document.getElementById("tool-measure").classList.remove("active");
map.getTargetElement().style.cursor = "";
document.getElementById("measure-hint").textContent = "Medicion completada";
showToast("Medicion completada", "success");
}
});

document.getElementById("tool-locate").addEventListener("click", function() {
if (!navigator.geolocation) { showToast("Geolocalizacion no disponible", "warning"); return; }
showToast("Obteniendo ubicacion...", "info");
navigator.geolocation.getCurrentPosition(function(pos) {
var lonlat = [pos.coords.longitude, pos.coords.latitude];
view.animate({ center: ol.proj.fromLonLat(lonlat), zoom: 15, duration: 500 });
var locFeature = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat(lonlat)) });
locFeature.setStyle(new ol.style.Style({
image: new ol.style.Circle({
radius: 8,
fill: new ol.style.Fill({ color: "rgba(0, 206, 201, 0.3)" }),
stroke: new ol.style.Stroke({ color: "#00cec9", width: 2 })
})
}));
measureSource.addFeature(locFeature);
showToast("Ubicacion encontrada", "success");
}, function() {
showToast("No se pudo obtener la ubicacion", "warning");
}, { enableHighAccuracy: true });
});

document.getElementById("mobile-toggle").addEventListener("click", function() {
document.getElementById("panel").classList.add("open");
});

document.getElementById("close-panel").addEventListener("click", function() {
document.getElementById("panel").classList.remove("open");
});

function showToast(message, type) {
type = type || "info";
var icons = { success: "fa-circle-check", info: "fa-circle-info", warning: "fa-triangle-exclamation" };
var container = document.getElementById("toast-container");
var toast = document.createElement("div");
toast.className = "toast " + type;
toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + message;
container.appendChild(toast);
setTimeout(function() {
toast.style.opacity = "0";
toast.style.transform = "translateX(20px)";
toast.style.transition = "all 0.3s ease";
setTimeout(function() { toast.remove(); }, 300);
}, 3000);
}

updateCounts();
applyFilters();
showToast("Mapa de Quito (OpenLayers) cargado", "success");

})();
</script>
</body>
</html>
