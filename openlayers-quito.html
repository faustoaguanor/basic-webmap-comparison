<!doctype html>
<html lang="es-EC">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Visor de puntos turísticos de Quito con OpenLayers: proyección EPSG:3857, capas raster y vectoriales." />
<title>Quito GIS | OpenLayers</title>
<script src="assets/quito-theme.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.4.0/ol.css" />
<link rel="stylesheet" href="assets/quito.css" />
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/ol@10.4.0/dist/ol.js"></script>
<script src="assets/quito-core.js"></script>
<script src="assets/quito-ui.js"></script>
<script>
(function () {
  "use strict";
  var C = QuitoCore;
  var ui = QuitoUI.mount({ library: "OpenLayers", version: "10.4.0" });
  var fromLonLat = ol.proj.fromLonLat;
  var toLonLat = ol.proj.toLonLat;

  var view = new ol.View({ center: fromLonLat([C.CENTER.lng, C.CENTER.lat]), zoom: C.ZOOM, minZoom: C.MIN_ZOOM, maxZoom: C.MAX_ZOOM });

  var map = new ol.Map({
    target: ui.mapEl,
    view: view,
    controls: [
      new ol.control.Attribution({ collapsible: false }),
      new ol.control.ScaleLine({ units: "metric" }),
    ],
  });

  /* Mapas base: una capa Tile por proveedor, creada al usarse por primera vez (las ocultas no descargan). */
  var baseLayers = {};
  var activeBase = null;
  function baseLayer(def) {
    if (baseLayers[def.id]) return baseLayers[def.id];
    var source = new ol.source.XYZ({ url: def.url, maxZoom: def.maxNativeZoom, attributions: def.attribution, crossOrigin: "anonymous" });
    source.on("tileloadend", function () { ui.basemapEvent("load", def.id); });
    source.on("tileloaderror", function () { ui.basemapEvent("error", def.id); });
    var layer = new ol.layer.Tile({ source: source, visible: false });
    map.getLayers().insertAt(0, layer);
    return (baseLayers[def.id] = layer);
  }

  /* Puntos: capa vectorial con estilos en caché; el filtro es una función de estilo (null = oculto). */
  var visibleIds = new Set();
  var selectedId = null;
  var styleCache = {};
  function pointStyle(tipo, selected) {
    var key = tipo + (selected ? "*" : "");
    if (!styleCache[key]) {
      var circle = new ol.style.Style({
        image: new ol.style.Circle({
          radius: 8,
          fill: new ol.style.Fill({ color: C.categoryById(tipo).color }),
          stroke: new ol.style.Stroke({ color: "#ffffff", width: 2 }),
        }),
      });
      styleCache[key] = selected
        ? [new ol.style.Style({ image: new ol.style.Circle({ radius: 13, fill: new ol.style.Fill({ color: "rgba(0,122,194,0.25)" }), stroke: new ol.style.Stroke({ color: "#007ac2", width: 2 }) }) }), circle]
        : circle;
    }
    return styleCache[key];
  }
  var byId = {};
  var features = C.POIS.map(function (p) {
    byId[p.id] = p;
    var f = new ol.Feature({ geometry: new ol.geom.Point(fromLonLat([p.lng, p.lat])), tipo: p.tipo });
    f.setId(p.id);
    return f;
  });
  var poiLayer = new ol.layer.Vector({
    source: new ol.source.Vector({ features: features }),
    style: function (f) { return visibleIds.has(f.getId()) ? pointStyle(f.get("tipo"), f.getId() === selectedId) : null; },
  });
  map.addLayer(poiLayer);

  /* Medición */
  var measureSource = new ol.source.Vector();
  var casing = new ol.style.Style({ stroke: new ol.style.Stroke({ color: "rgba(255,255,255,0.9)", width: 6 }) });
  var line = new ol.style.Style({ stroke: new ol.style.Stroke({ color: "#d83020", width: 3 }) });
  var vertex = new ol.style.Style({ image: new ol.style.Circle({ radius: 4, fill: new ol.style.Fill({ color: "#fff" }), stroke: new ol.style.Stroke({ color: "#d83020", width: 2 }) }) });
  map.addLayer(new ol.layer.Vector({
    source: measureSource,
    style: function (f) { return f.getGeometry().getType() === "LineString" ? [casing, line] : vertex; },
  }));
  var dblZoom = map.getInteractions().getArray().filter(function (i) { return i instanceof ol.interaction.DoubleClickZoom; })[0];
  var measuring = false;

  /* Popup como Overlay */
  var popupEl = document.createElement("div");
  popupEl.className = "ol-popup";
  popupEl.innerHTML = '<button type="button" class="ol-popup-close" aria-label="Cerrar">&times;</button><div class="ol-popup-body"></div>';
  var popupBody = popupEl.querySelector(".ol-popup-body");
  var overlay = new ol.Overlay({ element: popupEl, positioning: "bottom-center", stopEvent: true, offset: [0, -6], autoPan: { animation: { duration: 250 } } });
  map.addOverlay(overlay);
  function closePopup() {
    overlay.setPosition(undefined);
    selectedId = null;
    poiLayer.changed();
    ui.selectPoi(null);
  }
  popupEl.querySelector(".ol-popup-close").addEventListener("click", closePopup);
  function openPoi(poi) {
    popupBody.innerHTML = C.popupHtml(poi);
    overlay.setPosition(fromLonLat([poi.lng, poi.lat]));
    selectedId = poi.id;
    poiLayer.changed();
    ui.selectPoi(poi.id);
  }

  map.on("click", function (e) {
    var ll = toLonLat(e.coordinate);
    if (measuring) { ui.measureClick(ll[0], ll[1]); return; }
    var hit = map.forEachFeatureAtPixel(e.pixel, function (f) { return f; }, { layerFilter: function (l) { return l === poiLayer; } });
    if (hit) openPoi(byId[hit.getId()]);
  });
  map.on("dblclick", function () { if (measuring) ui.measureFinish(); });
  map.on("pointermove", function (e) {
    if (e.dragging) return;
    var ll = toLonLat(e.coordinate);
    ui.cursor(ll[0], ll[1]);
    map.getTargetElement().style.cursor = measuring ? "crosshair" : map.hasFeatureAtPixel(e.pixel, { layerFilter: function (l) { return l === poiLayer; } }) ? "pointer" : "";
  });
  map.on("postrender", function () {
    var c = toLonLat(view.getCenter());
    ui.view({ lng: c[0], lat: c[1], zoom: view.getZoom() });
  });

  var locationLayer = null;

  ui.attach({
    setBasemap: function (def) {
      if (activeBase) activeBase.setVisible(false);
      activeBase = baseLayer(def);
      activeBase.setVisible(true);
    },
    setVisible: function (ids) {
      visibleIds = ids;
      poiLayer.changed();
      if (selectedId && !ids.has(selectedId)) closePopup();
    },
    focus: function (poi) {
      view.animate({ center: fromLonLat([poi.lng, poi.lat]), zoom: Math.max(view.getZoom(), 15), duration: 800 });
      openPoi(poi);
    },
    home: function () { view.animate({ center: fromLonLat([C.CENTER.lng, C.CENTER.lat]), zoom: C.ZOOM, duration: 800 }); },
    zoomBy: function (d) { view.animate({ zoom: view.getZoom() + d, duration: 250 }); },
    setMeasure: function (on) {
      measuring = on;
      if (dblZoom) dblZoom.setActive(!on);
      if (on) closePopup();
    },
    drawMeasure: function (pts) {
      measureSource.clear();
      var coords = pts.map(function (p) { return fromLonLat(p); });
      if (coords.length > 1) measureSource.addFeature(new ol.Feature(new ol.geom.LineString(coords)));
      coords.forEach(function (c) { measureSource.addFeature(new ol.Feature(new ol.geom.Point(c))); });
    },
    showLocation: function (lng, lat) {
      if (locationLayer) map.removeLayer(locationLayer);
      locationLayer = new ol.layer.Vector({
        source: new ol.source.Vector({ features: [new ol.Feature(new ol.geom.Point(fromLonLat([lng, lat])))] }),
        style: new ol.style.Style({ image: new ol.style.Circle({ radius: 7, fill: new ol.style.Fill({ color: "#007ac2" }), stroke: new ol.style.Stroke({ color: "#fff", width: 3 }) }) }),
      });
      map.addLayer(locationLayer);
      view.animate({ center: fromLonLat([lng, lat]), zoom: 15, duration: 800 });
    },
    resize: function () { map.updateSize(); },
  });
  window.__quito = { map: map, ui: ui, visibleCount: function () { return visibleIds.size; } }; // sólo para depuración/pruebas
})();
</script>
</body>
</html>
