<!doctype html>
<html lang="es-EC">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Visor de puntos turísticos de Quito con Leaflet: búsqueda, filtros, mapas base de Esri y medición." />
<title>Quito GIS | Leaflet</title>
<script src="assets/quito-theme.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.css" />
<link rel="stylesheet" href="assets/quito.css" />
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-minimap@3.6.1/dist/Control.MiniMap.min.js"></script>
<script src="assets/quito-core.js"></script>
<script src="assets/quito-ui.js"></script>
<script>
(function () {
  "use strict";
  var C = QuitoCore;
  var ui = QuitoUI.mount({ library: "Leaflet", version: "1.9.4" });

  var map = L.map(ui.mapEl, {
    center: [C.CENTER.lat, C.CENTER.lng],
    zoom: C.ZOOM,
    minZoom: C.MIN_ZOOM,
    maxZoom: C.MAX_ZOOM,
    zoomControl: false,
    preferCanvas: true,
  });
  L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);

  /* Mapas base: una capa por proveedor, creada la primera vez que se usa. */
  var baseLayers = {};
  var activeBase = null;
  function baseLayer(def) {
    if (baseLayers[def.id]) return baseLayers[def.id];
    var layer = L.tileLayer(def.url, {
      maxZoom: C.MAX_ZOOM,
      maxNativeZoom: def.maxNativeZoom,
      attribution: def.attribution,
      crossOrigin: true,
    });
    layer.on("tileload", function () { ui.basemapEvent("load", def.id); });
    layer.on("tileerror", function () { ui.basemapEvent("error", def.id); });
    return (baseLayers[def.id] = layer);
  }

  new L.Control.MiniMap(L.tileLayer(C.basemapById("gray").url, { minZoom: 0, maxZoom: 12 }), {
    toggleDisplay: true, minimized: true, position: "bottomright", width: 150, height: 120, zoomLevelOffset: -5,
  }).addTo(map);

  /* Puntos: circleMarker en un renderizador canvas (barato incluso con miles de puntos). */
  var group = L.layerGroup().addTo(map);
  var markers = {};
  function markerStyle(poi, selected) {
    return {
      radius: selected ? 10 : 8, weight: 2, color: selected ? "#007ac2" : "#fff",
      fillColor: C.categoryById(poi.tipo).color, fillOpacity: 1,
    };
  }
  var popup = L.popup({ maxWidth: 300, offset: [0, -4] });
  var selectedId = null;
  function setSelected(id) {
    if (selectedId && markers[selectedId]) markers[selectedId].setStyle(markerStyle(markers[selectedId].poi, false));
    selectedId = id;
    if (id && markers[id]) { markers[id].setStyle(markerStyle(markers[id].poi, true)); markers[id].bringToFront(); }
    ui.selectPoi(id);
  }
  function openPoi(poi) {
    popup.setLatLng([poi.lat, poi.lng]).setContent(C.popupHtml(poi)).openOn(map);
    setSelected(poi.id);
  }
  C.POIS.forEach(function (poi) {
    var m = L.circleMarker([poi.lat, poi.lng], markerStyle(poi, false));
    m.poi = poi;
    m.on("click", function () { if (!ui.isMeasuring()) openPoi(poi); });
    markers[poi.id] = m;
  });
  map.on("popupclose", function () { setSelected(null); });

  /* Medición */
  var measureGroup = L.layerGroup().addTo(map);
  var measuring = false;

  map.on("click", function (e) { if (measuring) ui.measureClick(e.latlng.lng, e.latlng.lat); });
  map.on("dblclick", function () { if (measuring) ui.measureFinish(); });
  map.on("mousemove", function (e) { ui.cursor(e.latlng.lng, e.latlng.lat); });
  map.on("move zoom", function () { var c = map.getCenter(); ui.view({ lng: c.lng, lat: c.lat, zoom: map.getZoom() }); });

  var locationLayer = null;

  ui.attach({
    setBasemap: function (def) {
      if (activeBase) map.removeLayer(activeBase);
      activeBase = baseLayer(def).addTo(map);
      activeBase.bringToBack();
    },
    setVisible: function (ids) {
      group.clearLayers();
      Object.keys(markers).forEach(function (id) { if (ids.has(id)) group.addLayer(markers[id]); });
      if (selectedId && !ids.has(selectedId)) map.closePopup();
    },
    focus: function (poi) {
      map.flyTo([poi.lat, poi.lng], Math.max(map.getZoom(), 15), { duration: 0.8 });
      openPoi(poi);
    },
    home: function () { map.flyTo([C.CENTER.lat, C.CENTER.lng], C.ZOOM, { duration: 0.8 }); },
    zoomBy: function (d) { map.setZoom(map.getZoom() + d); },
    setMeasure: function (on) {
      measuring = on;
      map.getContainer().style.cursor = on ? "crosshair" : "";
      if (on) { map.doubleClickZoom.disable(); map.closePopup(); } else { map.doubleClickZoom.enable(); }
    },
    drawMeasure: function (pts) {
      measureGroup.clearLayers();
      var latlngs = pts.map(function (p) { return [p[1], p[0]]; });
      if (latlngs.length > 1) {
        L.polyline(latlngs, { color: "#fff", weight: 6, opacity: 0.9, interactive: false }).addTo(measureGroup);
        L.polyline(latlngs, { color: "#d83020", weight: 3, interactive: false }).addTo(measureGroup);
      }
      latlngs.forEach(function (ll) {
        L.circleMarker(ll, { radius: 4, weight: 2, color: "#d83020", fillColor: "#fff", fillOpacity: 1, interactive: false }).addTo(measureGroup);
      });
    },
    showLocation: function (lng, lat) {
      if (locationLayer) map.removeLayer(locationLayer);
      locationLayer = L.circleMarker([lat, lng], { radius: 7, weight: 3, color: "#fff", fillColor: "#007ac2", fillOpacity: 1 }).addTo(map);
      map.flyTo([lat, lng], 15, { duration: 0.8 });
    },
    resize: function () { map.invalidateSize(); },
  });

  var c = map.getCenter();
  ui.view({ lng: c.lng, lat: c.lat, zoom: map.getZoom() });
  ui.cursor(c.lng, c.lat);
  window.__quito = { map: map, ui: ui, visibleCount: function () { return group.getLayers().length; } }; // sólo para depuración/pruebas
})();
</script>
</body>
</html>
