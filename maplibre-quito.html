<!doctype html>
<html lang="es-EC">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Visor de puntos turísticos de Quito con MapLibre GL: WebGL, vista inclinada 3D, filtros y medición." />
<title>Quito GIS | MapLibre GL</title>
<script src="assets/quito-theme.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<link rel="stylesheet" href="assets/quito.css" />
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="assets/quito-core.js"></script>
<script src="assets/quito-ui.js"></script>
<script>
(function () {
  "use strict";
  var C = QuitoCore;
  var ui = QuitoUI.mount({ library: "MapLibre GL", version: "4.7.1", supports3D: true });

  /*
   * Un único estilo inline con todos los mapas base como capas raster. Cambiar de mapa base es
   * sólo alternar `visibility`: no hay setStyle(), no se pierden las capas de puntos y no existe
   * un style.json remoto que pueda fallar. Una capa oculta no descarga teselas.
   */
  var sources = {};
  var layers = [];
  C.BASEMAPS.forEach(function (b) {
    sources["bm-" + b.id] = { type: "raster", tiles: [b.url], tileSize: 256, maxzoom: b.maxNativeZoom, attribution: b.attribution };
    layers.push({ id: "bm-" + b.id, type: "raster", source: "bm-" + b.id, layout: { visibility: "none" } });
  });
  sources.pois = {
    type: "geojson",
    data: {
      type: "FeatureCollection",
      features: C.POIS.map(function (p) {
        return { type: "Feature", geometry: { type: "Point", coordinates: [p.lng, p.lat] }, properties: { id: p.id, tipo: p.tipo } };
      }),
    },
  };
  sources.measure = { type: "geojson", data: { type: "FeatureCollection", features: [] } };

  var colorExpr = ["match", ["get", "tipo"]];
  C.CATEGORIES.forEach(function (c) { colorExpr.push(c.id, c.color); });
  colorExpr.push("#6a6a6a");

  layers.push(
    { id: "pois-selected", type: "circle", source: "pois", filter: ["==", ["get", "id"], ""], paint: { "circle-radius": 13, "circle-color": "#007ac2", "circle-opacity": 0.25, "circle-stroke-width": 2, "circle-stroke-color": "#007ac2" } },
    { id: "pois", type: "circle", source: "pois", paint: { "circle-radius": 8, "circle-color": colorExpr, "circle-stroke-width": 2, "circle-stroke-color": "#ffffff" } },
    { id: "measure-casing", type: "line", source: "measure", filter: ["==", ["geometry-type"], "LineString"], layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#ffffff", "line-width": 6, "line-opacity": 0.9 } },
    { id: "measure-line", type: "line", source: "measure", filter: ["==", ["geometry-type"], "LineString"], layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#d83020", "line-width": 3 } },
    { id: "measure-pts", type: "circle", source: "measure", filter: ["==", ["geometry-type"], "Point"], paint: { "circle-radius": 4, "circle-color": "#ffffff", "circle-stroke-width": 2, "circle-stroke-color": "#d83020" } }
  );

  /*
   * MapLibre numera el zoom con teselas de 512 px: su zoom N equivale al zoom N+1 de Leaflet/OL
   * (teselas de 256 px). Z() convierte del zoom común (256 px) al de MapLibre y W() al revés,
   * para que las cuatro librerías muestren la misma escala con el mismo "zoom 13".
   */
  function Z(z) { return z - 1; }
  function W(z) { return z + 1; }

  var map;
  try {
    map = new maplibregl.Map({
      container: ui.mapEl,
      style: { version: 8, sources: sources, layers: layers },
      center: [C.CENTER.lng, C.CENTER.lat],
      zoom: Z(C.ZOOM),
      minZoom: Z(C.MIN_ZOOM),
      maxZoom: Z(C.MAX_ZOOM),
      maxPitch: 70,
      attributionControl: { compact: false },
    });
  } catch (err) {
    // Sin WebGL (aceleración por hardware desactivada, GPU en lista negra...) MapLibre lanza aquí.
    console.error(err);
    ui.notify("MapLibre necesita WebGL y no está disponible: " + (err && err.message ? err.message : err), "danger");
    return;
  }
  map.addControl(new maplibregl.NavigationControl({ showZoom: false, showCompass: true, visualizePitch: true }), "top-right");
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 140, unit: "metric" }), "bottom-left");
  map.doubleClickZoom.enable();

  var popup = new maplibregl.Popup({ offset: 14, maxWidth: "300px", closeButton: true, closeOnClick: false });
  var byId = {};
  C.POIS.forEach(function (p) { byId[p.id] = p; });
  var measuring = false;
  var activeId = null;

  function setSelected(id) {
    activeId = id;
    map.setFilter("pois-selected", ["==", ["get", "id"], id || ""]);
    ui.selectPoi(id);
  }
  function openPoi(poi) {
    popup.setLngLat([poi.lng, poi.lat]).setHTML(C.popupHtml(poi)).addTo(map);
    setSelected(poi.id);
  }
  popup.on("close", function () { setSelected(null); });

  map.on("click", function (e) {
    if (measuring) { ui.measureClick(e.lngLat.lng, e.lngLat.lat); return; }
    var hit = map.queryRenderedFeatures(e.point, { layers: ["pois"] })[0];
    if (hit) openPoi(byId[hit.properties.id]);
  });
  map.on("dblclick", function () { if (measuring) ui.measureFinish(); });
  map.on("mousemove", function (e) {
    ui.cursor(e.lngLat.lng, e.lngLat.lat);
    if (!measuring) map.getCanvas().style.cursor = map.queryRenderedFeatures(e.point, { layers: ["pois"] }).length ? "pointer" : "";
  });
  map.on("move", function () { var c = map.getCenter(); ui.view({ lng: c.lng, lat: c.lat, zoom: W(map.getZoom()) }); });

  /* Errores de teselas del mapa base visible (los de otras fuentes se ignoran). */
  var activeBase = null;
  var reported = false;
  map.on("error", function (e) {
    if (e && e.sourceId && e.sourceId === "bm-" + activeBase) { ui.basemapEvent("error", activeBase); return; }
    if (reported || (e && e.sourceId)) return;
    reported = true;
    console.error(e && e.error);
    ui.notify("Error de MapLibre: " + (e && e.error && e.error.message ? e.error.message : "desconocido"), "danger");
  });
  map.on("data", function (e) {
    if (e.dataType === "source" && e.tile && e.sourceId === "bm-" + activeBase) ui.basemapEvent("load", activeBase);
  });

  var locationMarker = null;
  var visibleCount = 0;

  map.once("style.load", function () {
    ui.attach({
      setBasemap: function (def) {
        C.BASEMAPS.forEach(function (b) { map.setLayoutProperty("bm-" + b.id, "visibility", b.id === def.id ? "visible" : "none"); });
        activeBase = def.id;
      },
      setVisible: function (ids) {
        visibleCount = ids.size;
        map.setFilter("pois", ["in", ["get", "id"], ["literal", Array.from(ids)]]);
        if (activeId && !ids.has(activeId)) popup.remove();
      },
      focus: function (poi) {
        map.flyTo({ center: [poi.lng, poi.lat], zoom: Math.max(map.getZoom(), Z(15)), duration: 1000 });
        openPoi(poi);
      },
      home: function () { map.flyTo({ center: [C.CENTER.lng, C.CENTER.lat], zoom: Z(C.ZOOM), pitch: 0, bearing: 0, duration: 1000 }); },
      zoomBy: function (d) { map.easeTo({ zoom: map.getZoom() + d, duration: 250 }); },
      setMeasure: function (on) {
        measuring = on;
        map.getCanvas().style.cursor = on ? "crosshair" : "";
        if (on) { map.doubleClickZoom.disable(); popup.remove(); } else { map.doubleClickZoom.enable(); }
      },
      drawMeasure: function (pts) {
        var features = [];
        if (pts.length > 1) features.push({ type: "Feature", geometry: { type: "LineString", coordinates: pts }, properties: {} });
        pts.forEach(function (p) { features.push({ type: "Feature", geometry: { type: "Point", coordinates: p }, properties: {} }); });
        map.getSource("measure").setData({ type: "FeatureCollection", features: features });
      },
      showLocation: function (lng, lat) {
        if (locationMarker) locationMarker.remove();
        locationMarker = new maplibregl.Marker({ color: "#007ac2" }).setLngLat([lng, lat]).addTo(map);
        map.flyTo({ center: [lng, lat], zoom: Z(15), duration: 1000 });
      },
      setPitch: function (deg) { map.easeTo({ pitch: deg, duration: 800 }); },
      resize: function () { map.resize(); },
    });
    var c = map.getCenter();
    ui.view({ lng: c.lng, lat: c.lat, zoom: W(map.getZoom()) });
    ui.cursor(c.lng, c.lat);
  });
  window.__quito = { map: map, ui: ui, visibleCount: function () { return visibleCount; } }; // sólo para depuración/pruebas
})();
</script>
</body>
</html>
