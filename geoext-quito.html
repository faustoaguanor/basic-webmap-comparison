<!doctype html>
<html lang="es-EC">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Visor de puntos turísticos de Quito con GeoExt (Ext JS + OpenLayers): componentes de interfaz ricos sobre un mapa OpenLayers." />
<title>Quito GIS | GeoExt</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.4.0/ol.css" />
<link rel="stylesheet" href="vendor/extjs/theme-crisp/theme-crisp-all.css" />
<link rel="stylesheet" href="assets/quito.css" />
<link rel="stylesheet" href="assets/quito-geoext.css" />
</head>
<body class="gx">
<noscript>Este visor necesita JavaScript.</noscript>

<script src="https://cdn.jsdelivr.net/npm/ol@10.4.0/dist/ol.js"></script>
<script src="vendor/extjs/ext-all.js"></script>
<script src="assets/quito-core.js"></script>
<script>
(function () {
  "use strict";
  var C = QuitoCore;

  if (!window.Ext || !window.ol) {
    document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">No se pudieron cargar Ext JS u OpenLayers desde el CDN. Revise la conexión y recargue.</p>';
    return;
  }

  /* Ext.Loader descarga bajo demanda las clases de GeoExt incluidas en vendor/geoext/src. */
  Ext.Loader.setConfig({
    enabled: true,
    disableCaching: false,
    paths: { GeoExt: "vendor/geoext/src" },
  });
  Ext.require(["GeoExt.component.Map", "GeoExt.component.Popup"]);

  var NAV = [
    ["index.html", "Inicio"], ["leaflet-quito.html", "Leaflet"], ["maplibre-quito.html", "MapLibre GL"],
    ["openlayers-quito.html", "OpenLayers"], ["geoext-quito.html", "GeoExt"],
  ];

  function fail(e) {
    console.error(e);
    document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">No se pudo iniciar el visor GeoExt: ' + C.escapeHtml(e && e.message ? e.message : e) + "</p>";
  }

  Ext.onReady(function () { try { start(); } catch (e) { fail(e); } });

  function start() {
    var fromLonLat = ol.proj.fromLonLat, toLonLat = ol.proj.toLonLat;

    /* ---------- mapa OpenLayers ---------- */
    var view = new ol.View({ center: fromLonLat([C.CENTER.lng, C.CENTER.lat]), zoom: C.ZOOM, minZoom: C.MIN_ZOOM, maxZoom: C.MAX_ZOOM });
    var olMap = new ol.Map({ view: view, controls: [new ol.control.Zoom(), new ol.control.Attribution({ collapsible: false }), new ol.control.ScaleLine({ units: "metric" })] });

    var baseLayers = {}, activeBase = null, basemapId = null, tileStats = {};
    function baseLayer(def) {
      if (baseLayers[def.id]) return baseLayers[def.id];
      var source = new ol.source.XYZ({ url: def.url, maxZoom: def.maxNativeZoom, attributions: def.attribution, crossOrigin: "anonymous" });
      var stats = (tileStats[def.id] = { ok: 0, err: 0 });
      source.on("tileloadend", function () { stats.ok++; });
      source.on("tileloaderror", function () {
        stats.err++;
        if (def.id === basemapId && !stats.ok && stats.err >= 3 && def.id !== C.FALLBACK_BASEMAP) {
          setStatus("«" + def.label + "» no responde. Se cambió a OpenStreetMap.");
          basemapCombo.setValue(C.FALLBACK_BASEMAP);
        }
      });
      var layer = new ol.layer.Tile({ source: source, visible: false });
      olMap.getLayers().insertAt(0, layer);
      return (baseLayers[def.id] = layer);
    }
    function setBasemap(id) {
      var def = C.basemapById(id) || C.basemapById(C.DEFAULT_BASEMAP);
      if (activeBase) activeBase.setVisible(false);
      basemapId = def.id;
      activeBase = baseLayer(def);
      activeBase.setVisible(true);
    }

    var visibleIds = new Set(C.POIS.map(function (p) { return p.id; }));
    var selectedId = null, byId = {}, styleCache = {};
    function pointStyle(tipo, selected) {
      var key = tipo + (selected ? "*" : "");
      return styleCache[key] || (styleCache[key] = new ol.style.Style({
        image: new ol.style.Circle({
          radius: selected ? 11 : 8,
          fill: new ol.style.Fill({ color: C.categoryById(tipo).color }),
          stroke: new ol.style.Stroke({ color: selected ? "#007ac2" : "#ffffff", width: 2 }),
        }),
      }));
    }
    var poiLayer = new ol.layer.Vector({
      source: new ol.source.Vector({
        features: C.POIS.map(function (p) {
          byId[p.id] = p;
          var f = new ol.Feature({ geometry: new ol.geom.Point(fromLonLat([p.lng, p.lat])), tipo: p.tipo });
          f.setId(p.id);
          return f;
        }),
      }),
      style: function (f) { return visibleIds.has(f.getId()) ? pointStyle(f.get("tipo"), f.getId() === selectedId) : null; },
    });
    olMap.addLayer(poiLayer);

    var measureSource = new ol.source.Vector();
    olMap.addLayer(new ol.layer.Vector({
      source: measureSource,
      style: function (f) {
        return f.getGeometry().getType() === "LineString"
          ? [new ol.style.Style({ stroke: new ol.style.Stroke({ color: "rgba(255,255,255,.9)", width: 6 }) }), new ol.style.Style({ stroke: new ol.style.Stroke({ color: "#d83020", width: 3 }) })]
          : new ol.style.Style({ image: new ol.style.Circle({ radius: 4, fill: new ol.style.Fill({ color: "#fff" }), stroke: new ol.style.Stroke({ color: "#d83020", width: 2 }) }) });
      },
    }));
    var dblZoom = olMap.getInteractions().getArray().filter(function (i) { return i instanceof ol.interaction.DoubleClickZoom; })[0];

    /* ---------- componentes GeoExt ---------- */
    var mapComponent = Ext.create("GeoExt.component.Map", { map: olMap, pointerRest: true, pointerRestInterval: 600, pointerRestPixelTolerance: 4 });
    var popup = Ext.create("GeoExt.component.Popup", { map: olMap, cls: "gx-popup qp-box", width: 300, html: "" });
    function closePopup() { popup.position(undefined); setSelected(null); }
    function openPoi(poi) {
      popup.update(C.popupHtml(poi));
      popup.position(fromLonLat([poi.lng, poi.lat]));
      setSelected(poi.id);
    }
    function setSelected(id) {
      selectedId = id;
      poiLayer.changed();
      var rec = id ? poiStore.getById(id) : null;
      if (rec) grid.getSelectionModel().select(rec, false, true); else grid.getSelectionModel().deselectAll(true);
    }

    /* ---------- datos de la interfaz ---------- */
    var poiStore = Ext.create("Ext.data.Store", {
      fields: ["id", "nombre", "descripcion", "tipo", "lng", "lat"],
      idProperty: "id",
      data: C.POIS,
    });
    var query = "", cats = new Set(C.CATEGORIES.map(function (c) { return c.id; }));

    function applyFilter() {
      var ok = new Set(C.filterPois(C.POIS, { query: query, categories: cats }).map(function (p) { return p.id; }));
      poiStore.clearFilter(true);
      poiStore.filterBy(function (r) { return ok.has(r.getId()); });
      visibleIds = ok;
      poiLayer.changed();
      grid.setTitle("Puntos de interés (" + ok.size + ")");
      if (selectedId && !ok.has(selectedId)) closePopup();
    }

    var searchField = Ext.create("Ext.form.field.Text", {
      emptyText: "Buscar por nombre o descripción",
      anchor: "100%",
      enableKeyEvents: true,
      triggers: { clear: { cls: "x-form-clear-trigger", hidden: true, handler: function (f) { f.setValue(""); } } },
      listeners: {
        change: function (f, v) { query = v || ""; f.getTrigger("clear").setHidden(!v); applyFilter(); },
      },
    });

    var catChecks = C.CATEGORIES.map(function (c) {
      return {
        xtype: "checkboxfield",
        boxLabel: '<span class="dot" style="background:' + c.color + '"></span>' + c.label,
        checked: true,
        inputValue: c.id,
        listeners: { change: function (cb, on) { if (on) cats.add(c.id); else cats.delete(c.id); applyFilter(); } },
      };
    });

    var basemapCombo = Ext.create("Ext.form.field.ComboBox", {
      fieldLabel: "Mapa base",
      labelWidth: 70,
      width: 260,
      editable: false,
      queryMode: "local",
      displayField: "label",
      valueField: "id",
      store: Ext.create("Ext.data.Store", { fields: ["id", "label"], data: C.BASEMAPS }),
      value: C.DEFAULT_BASEMAP,
      listeners: { change: function (cmb, v) { setBasemap(v); try { localStorage.setItem("quito-gis-basemap", v); } catch (e) {} } },
    });
    try { var saved = localStorage.getItem("quito-gis-basemap"); if (C.basemapById(saved)) basemapCombo.setValue(saved); } catch (e) {}

    /* Medición */
    var measuring = false, measurePts = [];
    var measureLabel = Ext.create("Ext.toolbar.TextItem", { text: "Distancia: —" });
    function drawMeasure() {
      measureSource.clear();
      var coords = measurePts.map(function (p) { return fromLonLat(p); });
      if (coords.length > 1) measureSource.addFeature(new ol.Feature(new ol.geom.LineString(coords)));
      coords.forEach(function (c) { measureSource.addFeature(new ol.Feature(new ol.geom.Point(c))); });
      measureLabel.setText("Distancia: " + (measurePts.length > 1 ? C.formatDistance(C.pathLength(measurePts)) : "—"));
    }
    function setMeasuring(on) {
      measuring = on;
      if (dblZoom) dblZoom.setActive(!on);
      measureBtn.toggle(on, true);
      if (on) closePopup();
    }
    var measureBtn = Ext.create("Ext.button.Button", {
      text: "Medir distancia", enableToggle: true,
      toggleHandler: function (b, on) { if (on) { measurePts = []; drawMeasure(); } setMeasuring(on); },
    });

    /* ---------- eventos del mapa ---------- */
    olMap.on("click", function (e) {
      var ll = toLonLat(e.coordinate);
      if (measuring) {
        var last = measurePts[measurePts.length - 1];
        if (!last || C.haversine(last, ll) >= 1) { measurePts.push(ll); drawMeasure(); }
        return;
      }
      var hit = olMap.forEachFeatureAtPixel(e.pixel, function (f) { return f; }, { layerFilter: function (l) { return l === poiLayer; } });
      if (hit) openPoi(byId[hit.getId()]);
    });
    olMap.on("dblclick", function () { if (measuring) setMeasuring(false); });

    var coordText = Ext.create("Ext.toolbar.TextItem", { text: "Lon — Lat —" });
    var scaleText = Ext.create("Ext.toolbar.TextItem", { text: "" });
    var statusText = Ext.create("Ext.toolbar.TextItem", { text: "" });
    var statusTimer;
    function setStatus(msg) { statusText.setText(msg); clearTimeout(statusTimer); statusTimer = setTimeout(function () { statusText.setText(""); }, 5000); }
    olMap.on("pointermove", function (e) {
      if (e.dragging) return;
      var ll = toLonLat(e.coordinate);
      coordText.setText("Lon " + C.formatCoord(ll[0], 5) + "  Lat " + C.formatCoord(ll[1], 5));
      olMap.getTargetElement().style.cursor = measuring ? "crosshair" : olMap.hasFeatureAtPixel(e.pixel, { layerFilter: function (l) { return l === poiLayer; } }) ? "pointer" : "";
    });
    function updateScale() {
      var c = toLonLat(view.getCenter());
      scaleText.setText("Escala " + C.formatScale(view.getZoom(), c[1]) + "   Zoom " + view.getZoom().toFixed(1));
    }
    olMap.on("moveend", updateScale);
    // Evento propio de GeoExt: el puntero "descansa" sobre el mapa.
    mapComponent.on("pointerrest", function (evt) {
      var hit = olMap.forEachFeatureAtPixel(evt.pixel, function (f) { return f; }, { layerFilter: function (l) { return l === poiLayer; } });
      if (hit) setStatus(byId[hit.getId()].nombre);
    });

    /* ---------- cuadrícula de resultados ---------- */
    var grid = Ext.create("Ext.grid.Panel", {
      title: "Puntos de interés (" + C.POIS.length + ")",
      flex: 1,
      store: poiStore,
      hideHeaders: true,
      forceFit: true,
      emptyText: "Ningún punto coincide con la búsqueda o el filtro.",
      viewConfig: { deferEmptyText: false, enableTextSelection: false },
      columns: [{
        dataIndex: "nombre", flex: 1, sortable: false, menuDisabled: true,
        renderer: function (v, meta, r) {
          var cat = C.categoryById(r.get("tipo"));
          return '<div class="gx-row"><span class="dot" style="background:' + cat.color + '"></span><div><div class="result-title">' +
            C.escapeHtml(v) + '</div><div class="result-cat">' + cat.label + "</div></div></div>";
        },
      }],
      listeners: {
        select: function (sm, rec, idx) { /* sólo marca; el vuelo se hace con itemclick */ },
        itemclick: function (g, rec) {
          var poi = byId[rec.getId()];
          view.animate({ center: fromLonLat([poi.lng, poi.lat]), zoom: Math.max(view.getZoom(), 15), duration: 800 });
          openPoi(poi);
        },
      },
    });

    /* ---------- composición ---------- */
    var header = Ext.create("Ext.Component", {
      region: "north", height: 48, cls: "header",
      html: '<a class="brand" href="index.html"><svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><ellipse cx="8" cy="8" rx="2.8" ry="6.5"/><path d="M1.5 8h13"/></svg><span class="brand-name">Quito GIS</span></a>' +
        '<span class="brand-lib">GeoExt 7.0.1 · Ext JS 6.2 GPL · OpenLayers 10.4</span>' +
        '<nav class="nav">' + NAV.map(function (n) { return '<a href="' + n[0] + '"' + (n[1] === "GeoExt" ? ' aria-current="page"' : "") + ">" + n[1] + "</a>"; }).join("") + "</nav>",
    });

    function goHome() { view.animate({ center: fromLonLat([C.CENTER.lng, C.CENTER.lat]), zoom: C.ZOOM, duration: 800 }); }
    function clearMeasure() { measurePts = []; drawMeasure(); }

    var side = Ext.create("Ext.panel.Panel", {
      region: "west", width: 340, split: true, title: "Capas y herramientas", collapsible: true,
      layout: { type: "vbox", align: "stretch" },
      items: [
        { xtype: "container", padding: 12, layout: "anchor", items: [searchField] },
        { xtype: "fieldset", title: "Categorías", margin: "0 12 8 12", padding: "4 8", defaults: { anchor: "100%" }, items: catChecks },
        grid,
      ],
    });

    var center = Ext.create("Ext.panel.Panel", {
      region: "center", layout: "fit", border: false, items: [mapComponent],
      tbar: [basemapCombo, "->", measureBtn, { text: "Inicio", handler: goHome }, { text: "Borrar medida", handler: clearMeasure }],
      bbar: [measureLabel, statusText, "->", coordText, "-", scaleText, "-", "WGS 84"],
    });

    Ext.create("Ext.container.Viewport", { layout: "border", items: [header, side, center] });
    setBasemap(basemapCombo.getValue());
    updateScale();
    window.__quito = { olMap: olMap, mapComponent: mapComponent, store: poiStore, visibleCount: function () { return visibleIds.size; } };
  }
})();
</script>
</body>
</html>
